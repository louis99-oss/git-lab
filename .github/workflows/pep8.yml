name: PEP 8

on:
  push:
  pull_request:

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja pycodestyle
        run: pip install pycodestyle
      - name: Walidacja składni PEP 8
        run: pycodestyle --exclude=.venv,venv --statistics --count .
